<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="Arial, Helvetica, sans-serif">
  <title>Installation in four steps: download, double click, compile, attach to a chart</title>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M900,0 L890,5 L900,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="258" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2328">Installation in four steps</text>

  <rect x="30" y="80" width="175" height="140" rx="12" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <circle cx="118" cy="80" r="17" fill="#1565c0"/>
  <text x="118" y="87" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">1</text>
  <text x="118" y="135" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2328">Download</text>
  <text x="118" y="165" text-anchor="middle" font-size="15" fill="#1f2328">Get the ZIP from</text>
  <text x="118" y="187" text-anchor="middle" font-size="15" fill="#1f2328">Releases, extract it</text>

  <rect x="255" y="80" width="175" height="140" rx="12" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <circle cx="343" cy="80" r="17" fill="#1565c0"/>
  <text x="343" y="87" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">2</text>
  <text x="343" y="135" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2328">Double click</text>
  <text x="343" y="165" text-anchor="middle" font-size="15" fill="#1f2328">on the installer</text>
  <text x="343" y="187" text-anchor="middle" font-size="15" fill="#1f2328">nine checks first</text>

  <rect x="480" y="80" width="175" height="140" rx="12" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <circle cx="568" cy="80" r="17" fill="#1565c0"/>
  <text x="568" y="87" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">3</text>
  <text x="568" y="135" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2328">Compile</text>
  <text x="568" y="165" text-anchor="middle" font-size="15" fill="#1f2328">Builds both files</text>
  <text x="568" y="187" text-anchor="middle" font-size="15" fill="#1f2328">and copies them</text>

  <rect x="705" y="80" width="175" height="140" rx="12" fill="#dff5e3" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="793" cy="80" r="17" fill="#2e7d32"/>
  <text x="793" y="87" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">4</text>
  <text x="793" y="135" text-anchor="middle" font-size="21" font-weight="bold" fill="#1b5e20">Attach</text>
  <text x="793" y="165" text-anchor="middle" font-size="15" fill="#1f2328">Drag the guard</text>
  <text x="793" y="187" text-anchor="middle" font-size="15" fill="#1f2328">onto one chart, by hand</text>

  <line x1="210" y1="150" x2="248" y2="150" stroke="#57606a" stroke-width="3" marker-end="url(#head)"/>
  <line x1="435" y1="150" x2="473" y2="150" stroke="#57606a" stroke-width="3" marker-end="url(#head)"/>
  <line x1="660" y1="150" x2="698" y2="150" stroke="#57606a" stroke-width="3" marker-end="url(#head)"/>
</svg>
